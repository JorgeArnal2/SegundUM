server.port=9000

# JWT (compartido con microservicios)
jwt.secret=${JWT_SECRET:secreto}
jwt.expiration=${JWT_EXPIRATION:3600}

# Microservicios internos
microservicios.usuarios.base-url=${USUARIOS_URL:http://localhost:8080/api/}
microservicios.productos.base-url=${PRODUCTOS_URL:http://localhost:8081/}
microservicios.compraventas.base-url=${COMPRAVENTAS_URL:http://localhost:8082/}
microservicios.valoraciones.base-url=${VALORACIONES_URL:http://localhost:8083/}

# Zuul: reenviar Authorization y cookies a los microservicios
zuul.sensitive-headers=
zuul.routes.usuarios.path=/api/usuarios/**
zuul.routes.usuarios.url=${microservicios.usuarios.base-url}usuarios
zuul.routes.productos.path=/api/productos/**
zuul.routes.productos.url=${microservicios.productos.base-url}productos
zuul.routes.categorias.path=/api/categorias/**
zuul.routes.categorias.url=${microservicios.productos.base-url}categorias
zuul.routes.compraventas.path=/api/compraventas/**
zuul.routes.compraventas.url=${microservicios.compraventas.base-url}compraventas
zuul.routes.valoraciones.path=/api/valoraciones/**
zuul.routes.valoraciones.url=${microservicios.valoraciones.base-url}valoraciones
