spring.datasource.url=jdbc:h2:mem:productos_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

app.rabbitmq.exchange=test-bus
app.rabbitmq.routing-key.usuario-creado=test.usuarios.creado
app.rabbitmq.routing-key.usuario-modificado=test.usuarios.modificado
app.rabbitmq.routing-key.compraventa-creada=test.compraventas.creada
app.rabbitmq.routing-key.producto-creado=test.productos.creado
app.rabbitmq.routing-key.producto-modificado=test.productos.modificado
app.rabbitmq.queue.microservice=test.productos
app.rabbitmq.binding-pattern.usuarios=test.usuarios.#
app.rabbitmq.binding-pattern.compraventas=test.compraventas.#

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.listener.simple.auto-startup=false
