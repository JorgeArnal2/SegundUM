# === Servidor ===
server.port=8082

# === MongoDB local ===
# Base de datos MongoDB local en el puerto por defecto 27017
spring.data.mongodb.uri=mongodb://localhost:27017/compraventas

# === OpenAPI / Swagger UI ===
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# === URLs de los microservicios externos ===
# Productos corre por defecto en el puerto 8080
microservicios.productos.base-url=${MICROSERVICIOS_PRODUCTOS_BASE_URL:http://localhost:8081/}
# Usuarios (JAX-RS / Grizzly) corre en el puerto 8080
microservicios.usuarios.base-url=${MICROSERVICIOS_USUARIOS_BASE_URL:http://localhost:8080/api/}

# === RabbitMQ ===
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

app.rabbitmq.exchange=bus
app.rabbitmq.routing-key.compraventa-creada=bus.compraventas.compraventa-creada
